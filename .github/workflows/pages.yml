# Publishes the games as a website with GitHub Pages, so they can be played and
# installed on iPad / iPhone (Safari → Share → Add to Home Screen):
#   /                 Moonsling       (web/)
#   /critter-merge/   Critter Merge   (critter-merge/web/)
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy web version

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Only the default branch publishes the live site.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r web/. _site/
          cp -r critter-merge/web _site/critter-merge
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
