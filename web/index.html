<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#12062b">
  <meta name="description" content="Moonsling — tap to sling your moon from planet to planet. One-tap arcade game with a daily challenge.">
  <title>Moonsling</title>
  <link rel="icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- iPad / iPhone: "Add to Home Screen" installs it as a full-screen app -->
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Moonsling">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <canvas id="game" aria-label="Moonsling game"></canvas>

    <!-- In-game HUD -->
    <div id="hud" class="layer">
      <button id="pauseBtn" class="icon-btn" aria-label="Pause">
        <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
      </button>
      <div id="score">0</div>
      <div id="runStars" class="chip"><span class="star">★</span><b>0</b></div>
      <div id="streak" class="streak"></div>
      <div id="hint" class="hint"></div>
    </div>

    <!-- Title -->
    <div id="title" class="layer screen" data-screen="title">
      <div class="top-row">
        <div class="toggles">
          <button id="soundBtn" class="icon-btn" aria-label="Toggle sound"></button>
          <button id="hapticBtn" class="icon-btn" aria-label="Toggle vibration"></button>
        </div>
        <div id="bankChip" class="chip"><span class="star">★</span><b>0</b></div>
      </div>
      <h1 class="logo">MOON<span>SLING</span></h1>
      <p class="tag">Tap to sling. Hit the planets.</p>
      <p id="titleBest" class="best"></p>
      <div class="grow"></div>
      <p class="tap-hint">TAP TO PLAY</p>
      <div class="menu-row">
        <button id="dailyBtn" class="menu-btn daily">
          <span class="ico">📅</span>
          <span class="lbl"><b id="dailyLabel">DAILY</b><small id="dailySub"></small></span>
        </button>
        <button id="skinsBtn" class="menu-btn">
          <span class="ico">🌙</span>
          <span class="lbl"><b>SKINS</b><small id="skinsSub"></small></span>
        </button>
      </div>
    </div>

    <!-- Pause -->
    <div id="pause" class="layer screen modal" data-screen="paused">
      <div class="panel">
        <h2>PAUSED</h2>
        <button id="resumeBtn" class="btn primary">RESUME</button>
        <button id="pauseHomeBtn" class="btn ghost">HOME</button>
      </div>
    </div>

    <!-- Game over -->
    <div id="over" class="layer screen modal" data-screen="over">
      <div class="panel">
        <p id="overMode" class="eyebrow"></p>
        <h2 id="overReason"></h2>
        <div id="overScore" class="big-score">0</div>
        <div id="overBadge" class="badge">NEW BEST!</div>
        <div class="stats">
          <div><b id="overBest">0</b><small>BEST</small></div>
          <div><b id="overHops">0</b><small>PLANETS</small></div>
          <div><b id="overPerfect">0</b><small>PERFECT</small></div>
        </div>
        <div id="overGrid" class="grid"></div>
        <div id="overUnlock" class="unlock">
          <div class="unlock-row"><span id="unlockText"></span><span id="unlockStars"></span></div>
          <div class="bar"><i id="unlockBar"></i></div>
        </div>
        <button id="retryBtn" class="btn primary big">
          <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
          PLAY AGAIN
        </button>
        <div class="btn-row">
          <button id="shareBtn" class="btn share">
            <svg viewBox="0 0 24 24"><path d="M18 16a3 3 0 0 0-2.4 1.2l-6.7-3.4a3 3 0 0 0 0-1.6l6.7-3.4A3 3 0 1 0 15 7l-6.7 3.4a3 3 0 1 0 0 3.2L15 17a3 3 0 1 0 3-1z"/></svg>
            SHARE
          </button>
          <button id="homeBtn" class="btn ghost">HOME</button>
        </div>
      </div>
    </div>

    <!-- Skins -->
    <div id="skins" class="layer screen modal" data-screen="skins">
      <div class="panel wide">
        <div class="panel-head">
          <h2>SKINS</h2>
          <div id="skinsBank" class="chip"><span class="star">★</span><b>0</b></div>
        </div>
        <p class="sub">Collect ★ in your runs to unlock new moons.</p>
        <div id="skinGrid" class="skin-grid"></div>
        <button id="skinsClose" class="btn ghost">BACK</button>
      </div>
    </div>

    <div id="banner" class="banner"></div>
    <div id="toast" class="toast"></div>
  </div>

  <script src="js/core.js"></script>
  <script src="js/render.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/share.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
